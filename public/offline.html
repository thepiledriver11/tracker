<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #223449;
        background: linear-gradient(155deg, #cbdef0, #e9f2fa 45%, #d3e4f2);
      }
      .box {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        color: #4a6480;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>Reconnect to load this screen. Logged sets are saved and will sync.</p>
    </div>
  </body>
</html>
